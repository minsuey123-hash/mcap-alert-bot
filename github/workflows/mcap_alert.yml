name: MCap Alert Bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run market cap check (single pass)
        env:
          NETWORK: ${{ vars.NETWORK }}
          MCAP_THRESHOLD_USD: ${{ vars.MCAP_THRESHOLD_USD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_ONCE: "true"
        run: python3 mcap_alert_bot.py

      - name: Commit updated state file
        run: |
          git config user.name "mcap-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_pools.json
          git diff --cached --quiet || git commit -m "update alerted pool state [skip ci]"
          git push
